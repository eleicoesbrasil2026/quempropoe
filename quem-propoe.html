<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quem propõe? Lula ou Flávio Bolsonaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage-a:#1B3FA8; --stage-b:#0A1B5C; --stage-c:#050D33;
  --panel:#0E2470; --panel-2:#13308C; --line:#3E63D6;
  --gold:#F5C542; --gold-deep:#C9931B; --gold-text:#2A1A00;
  --text:#F3F6FF; --muted:#B6C3EE; --dim:#7F90C8;
  --ok:#3DDC84; --bad:#FF6B5B;
  --focus:#FFFFFF;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage-a:#132E82; --stage-b:#071447; --stage-c:#020722;
    --panel:#0A1B57; --panel-2:#0F2672; --line:#2F51BF;
  }
}
:root[data-theme="dark"]{
  --stage-a:#132E82; --stage-b:#071447; --stage-c:#020722;
  --panel:#0A1B57; --panel-2:#0F2672; --line:#2F51BF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%, var(--stage-a) 0%, transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 100%, var(--stage-b) 0%, var(--stage-c) 75%);
  background-color:var(--stage-c);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background:
    conic-gradient(from 200deg at 12% -10%, transparent 0 8deg, rgba(255,255,255,.10) 10deg 14deg, transparent 16deg 360deg),
    conic-gradient(from 150deg at 88% -10%, transparent 0 4deg, rgba(255,255,255,.10) 6deg 10deg, transparent 12deg 360deg)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:22px 18px 56px}
.marca{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 22px}
.logo{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:.01em;color:var(--gold);text-shadow:0 3px 0 var(--gold-deep),0 0 28px rgba(245,197,66,.35)}
.selo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 45%,var(--gold-deep));color:var(--gold-text);font-family:Anton,Impact,sans-serif;font-size:1.5rem;box-shadow:0 0 0 3px #ffffff30,0 0 24px rgba(245,197,66,.45)}

.palco{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:22px;align-items:start}
.centro{display:flex;flex-direction:column;gap:18px}

/* Faixa de pergunta: formato hexagonal típico de programa de auditório */
.placa{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:26px 44px 28px;
  clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%);
  filter:drop-shadow(0 0 0 transparent)}
.moldura{padding:3px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-deep));
  clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%)}
.placa-topo{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.92rem;margin-bottom:10px}
.placa-topo b{color:var(--gold);font-weight:700}
.tag{display:inline-block;color:var(--gold);border:1px solid #F5C54280;border-radius:999px;padding:1px 12px;font-size:.84rem;margin:0 0 10px}
.pergunta{font-size:clamp(1.12rem,2.3vw,1.4rem);line-height:1.5;margin:0}
.pergunta strong{color:#FFE7A0}

.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opcao{appearance:none;border:0;padding:3px;cursor:pointer;background:linear-gradient(90deg,var(--line),#6E8EF0,var(--line));font:inherit;color:inherit;
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);transition:transform .12s ease}
.opcao span.miolo{display:flex;align-items:center;gap:14px;padding:16px 34px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
  clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%);font-size:1.25rem;font-weight:700;transition:background .15s}
.opcao .letra{font-family:Anton,Impact,sans-serif;color:var(--gold);font-size:1.4rem;font-weight:400;min-width:1.2em}
.opcao:hover .miolo{background:linear-gradient(180deg,#1B3CA3,#11297E)}
.opcao:active{transform:scale(.98)}
.opcao.sel{background:linear-gradient(90deg,var(--gold-deep),#FFE58A,var(--gold-deep))}
.opcao.sel .miolo{background:linear-gradient(180deg,#FFD25E,var(--gold));color:var(--gold-text)}
.opcao.sel .letra{color:var(--gold-text)}
.opcao:focus-visible{outline:none}
.opcao:focus-visible .miolo{box-shadow:inset 0 0 0 3px var(--focus)}

.confirma{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;min-height:58px;padding:0 6px}
.confirma p{margin:0;color:var(--muted)}
.confirma p.pergunta-host{font-family:Anton,Impact,sans-serif;font-size:1.5rem;color:var(--text);letter-spacing:.01em}
.botao{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:1.05rem;color:var(--gold-text);padding:14px 30px;border-radius:999px;
  background:linear-gradient(180deg,#FFE58A,var(--gold) 55%,var(--gold-deep));box-shadow:0 4px 0 #7A5A0C,0 0 22px rgba(245,197,66,.35);transition:transform .08s,box-shadow .08s}
.botao:hover{filter:brightness(1.06)}
.botao:active{transform:translateY(3px);box-shadow:0 1px 0 #7A5A0C}
.botao:disabled{opacity:.35;cursor:default;box-shadow:none}
.botao.sec{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.botao:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* Escada de perguntas */
.escada{list-style:none;margin:0;padding:12px;border-radius:16px;background:linear-gradient(180deg,#0B1E63cc,#06123Fcc);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column-reverse;gap:3px}
.escada li{display:flex;justify-content:space-between;align-items:center;padding:3px 12px;border-radius:999px;font-size:.92rem;color:var(--dim)}
.escada li .n{font-family:Anton,Impact,sans-serif;font-size:1rem;color:var(--muted);letter-spacing:.02em}
.escada li.feita{color:var(--muted)}
.escada li.feita::after{content:"respondida";font-size:.75rem}
.escada li.atual{background:linear-gradient(90deg,var(--gold-deep),var(--gold));color:var(--gold-text);font-weight:700}
.escada li.atual .n{color:var(--gold-text)}
.escada li.atual::after{content:"agora";font-size:.8rem}
.escada li.marco .n{color:#FFFFFF}

/* Abertura */
.abertura{text-align:center;max-width:720px;margin:10px auto 0}
.abertura h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(1.8rem,4.6vw,2.6rem);line-height:1.15;margin:0 0 14px;letter-spacing:.01em}
.abertura p{color:var(--muted);margin:0 auto 10px;max-width:58ch}
.regras{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 28px;text-align:left}
.regras div{background:#0B1E6399;border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.regras b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--gold);font-size:1.6rem;line-height:1.1}
.regras span{color:var(--muted);font-size:.95rem}
.nome{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 22px;max-width:420px}
.nome label{font-weight:700;font-size:1.05rem}
.nome input{width:100%;font:inherit;font-size:1.15rem;text-align:center;color:var(--text);background:#06123Fcc;border:0;border-radius:999px;padding:14px 22px;box-shadow:inset 0 0 0 2px var(--line);outline:none}
.nome input::placeholder{color:var(--dim)}
.nome input:focus{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px rgba(245,197,66,.3)}
.nome .aviso{margin:0;min-height:1.4em;color:var(--bad);font-size:.92rem}
.placar .quem{font-family:Anton,Impact,sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;color:var(--text);margin:0 0 2px;overflow-wrap:anywhere}

/* Resultado */
.resultado{max-width:860px;margin:0 auto}
.placar{text-align:center;margin:6px 0 26px}
.placar .rot{color:var(--muted);margin:0}
.placar .num{font-family:Anton,Impact,sans-serif;font-size:clamp(4.5rem,15vw,8rem);line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--gold-deep),0 0 40px rgba(245,197,66,.4);margin:6px 0}
.placar .frase{font-size:1.15rem;margin:0 0 14px}
.parciais{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.parciais span{background:#0B1E6399;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:6px 16px;color:var(--muted)}
.parciais b{color:var(--text)}
.filtro{display:flex;justify-content:center;gap:8px;margin:26px 0 16px;flex-wrap:wrap}
.filtro button{appearance:none;border:0;font:inherit;cursor:pointer;color:var(--muted);background:transparent;border-radius:999px;padding:6px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.filtro button[aria-pressed="true"]{background:var(--gold);color:var(--gold-text);box-shadow:none;font-weight:700}
.lista{display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,#0E2470ee,#0A1B57ee);border-radius:16px;padding:18px 20px;box-shadow:inset 4px 0 0 var(--ok),inset 0 0 0 1px var(--line)}
.card.erro{box-shadow:inset 4px 0 0 var(--bad),inset 0 0 0 1px var(--line)}
.card .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.card .cab .n{font-family:Anton,Impact,sans-serif;color:var(--gold);font-size:1.15rem}
.card .st{font-weight:700}
.card .st.ok{color:var(--ok)} .card .st.bad{color:var(--bad)}
.card .q{margin:0 0 10px}
.card .q strong{color:#FFE7A0}
.card .resp{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 8px;font-size:.96rem}
.card .resp b{color:var(--gold)}
.card .porque{margin:0;color:var(--muted);font-size:.95rem;border-top:1px dashed #3E63D680;padding-top:8px}
.acoes{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap}
footer{position:relative;z-index:1;max-width:72ch;margin:10px auto 0;padding:0 18px 30px;color:var(--dim);font-size:.85rem;text-align:center}

.entra{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .palco{grid-template-columns:1fr}
  .escada{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;order:-1}
  .escada li{padding:4px 9px;flex:0 0 auto}
  .escada li::after{content:none!important}
  .escada li.feita{background:#ffffff14}
  .regras{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .opcoes{grid-template-columns:1fr;gap:10px}
  .placa{padding:20px 30px 22px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
  .moldura{clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
  .confirma{justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca"><span class="selo" aria-hidden="true">?</span><span class="logo">Quem propõe?</span></div>
  <main id="app" aria-live="polite"></main>
</div>
<footer>Perguntas elaboradas a partir do “Programa de Governo” da coligação de Lula (PT, PSB, PV, PCdoB, PDT, PSOL e Rede) e das “Diretrizes do Plano de Governo Flávio Bolsonaro 2027-2030”. São resumos: para o texto completo, consulte os documentos originais nas páginas indicadas.</footer>
<script>
const PERGUNTAS = [
/* ===================== FLÁVIO BOLSONARO ===================== */
["F","Quem propõe declarar PCC, CV, milícias e as demais facções como <strong>organizações narcoterroristas</strong>, combatendo-as com bloqueio de ativos, desmonte da lavagem de dinheiro e consórcios com estados e municípios para inteligência e retomada de territórios?","Plano de Flávio Bolsonaro, “Terrorista vai ser tratado como terrorista”, p. 13."],
["F","Este candidato promete apoiar e sancionar a <strong>redução da maioridade penal de 18 para 16 anos</strong> e também punir maiores de 14 anos que cometerem crimes graves como estupro, tráfico, tortura e assassinato. Quem é?","Plano de Flávio Bolsonaro, “O crime do menor não é menor”, p. 13."],
["F","Quem propõe criar um <strong>Sistema Nacional de Fronteira</strong>: uma tropa de elite do Exército, da Marinha e da Aeronáutica, equipada com armas de guerra, inteligência e tecnologia, para interceptar fuzis e drogas por terra, portos e espaço aéreo nos 16 mil km de fronteira?","Plano de Flávio Bolsonaro, “Tropa de elite nas fronteiras”, p. 13-14."],
["F","Quem quer construir <strong>5 presídios de segurança máxima inspirados no modelo de El Salvador</strong>, que, somados aos 5 federais, formariam um complexo chamado “TREVA”, com presos sem celular, sem visita íntima e com visitas monitoradas?","Plano de Flávio Bolsonaro, “Mais presídios, menos bandidos soltos”, p. 14."],
["F","Este candidato promete criar, em parceria com os governos estaduais, <strong>meio milhão de novas vagas no sistema prisional em 4 anos</strong> para zerar o déficit carcerário. Quem é?","Plano de Flávio Bolsonaro, “Mais presídios, menos bandidos soltos”, p. 14."],
["F","Quem propõe usar a força da Presidência para aprovar a <strong>castração química</strong>, aplicada a estupradores e abusadores de crianças condenados pela Justiça?","Plano de Flávio Bolsonaro, “Cortar o mal pela raiz”, p. 14."],
["F","Quem propõe monitorar com <strong>tornozeleira eletrônica os agressores das mais de meio milhão de mulheres com medida protetiva</strong> e mudar a lei para que assassinos e agressores de mulheres cumpram a pena integralmente, sem sair após 55% dela?","Plano de Flávio Bolsonaro, “Tolerância zero para o feminicídio”, p. 14."],
["F","Este candidato quer usar <strong>tropas especiais da Marinha e da Aeronáutica para ocupar e monitorar permanentemente portos e aeroportos</strong>, citando o Porto de Santos como rota de exportação de cocaína. Quem é?","Plano de Flávio Bolsonaro, “Acabar com a cocaína made in Brazil”, p. 15."],
["F","Quem promete <strong>dobrar os investimentos federais em segurança pública</strong> ao longo do mandato, argumentando que hoje o governo federal destina só 0,4% de seus gastos à área?","Plano de Flávio Bolsonaro, “Menos verbo mais verba”, p. 15."],
["F","Quem propõe o <strong>“Muralha Brasileira”</strong>: um sistema nacional de reconhecimento facial integrado a bancos de dados criminais, inspirado no Smart Sampa, com mais de 1 milhão de novas câmeras em portos, aeroportos e áreas públicas?","Plano de Flávio Bolsonaro, “Luz, câmara, prisão”, p. 15."],
["F","Este candidato propõe <strong>redirecionar os recursos hoje destinados às famílias de detentos para as famílias das vítimas</strong> de crimes. Quem é?","Plano de Flávio Bolsonaro, “Auxílio das famílias das vítimas, não dos bandidos”, p. 15."],
["F","Quem quer <strong>acabar com a progressão de regime para crimes hediondos</strong>, fazendo com que quem tirar uma vida cumpra integralmente a condenação em regime fechado?","Plano de Flávio Bolsonaro, “Sem desconto para a barbárie”, p. 15-16."],
["F","Quem propõe que quem for pego <strong>roubando celular fique preso</strong> e que quem furta ou revende aparelho roubado tenha a <strong>pena inicial quadruplicada</strong>, sem benefícios?","Plano de Flávio Bolsonaro, “Quem não entrar na linha vai ser desligado da sociedade”, p. 16."],
["F","Quem propõe a <strong>Central da Mulher</strong>, um espaço físico em imóveis da União, com Sistema S e parceiros, que reúne acolhimento, orientação jurídica, apoio psicológico, vagas de emprego, crédito e renegociação de dívidas, além de caminhões e barcos itinerantes?","Plano de Flávio Bolsonaro, “Brasil por Elas – Central da Mulher”, p. 17."],
["F","Este candidato propõe a <strong>ClarIA</strong>, uma assistente virtual de inteligência artificial disponível 24 horas que orienta a mulher sobre medida protetiva, exames, emprego e crédito, e permite registrar ocorrência pelo chat. Quem é?","Plano de Flávio Bolsonaro, “ClarIA”, p. 18-19."],
["F","Quem propõe um <strong>“bônus de internet”</strong>: pacotes de conexão garantidos para que nenhuma mulher deixe de estudar, buscar emprego, empreender ou pedir ajuda por falta de internet?","Plano de Flávio Bolsonaro, “Bônus de internet”, p. 18."],
["F","Quem quer reunir o Ligue 180, as delegacias online, o botão de emergência e as centrais de monitoramento em <strong>uma só plataforma, com um sistema nacional de avaliação de risco</strong> que prioriza as denúncias de violência mais graves?","Plano de Flávio Bolsonaro, “Denúncia facilitada”, p. 18-19."],
["F","Quem propõe o programa <strong>“Ganha, Ganha”</strong>, no qual atitudes como concluir cursos, poupar e pagar contas em dia geram pontos que viram juros menores, cashback e crédito facilitado na CAIXA, no Banco da Amazônia e no Banco do Nordeste?","Plano de Flávio Bolsonaro, “Ganha, Ganha”, p. 19-20 e 46."],
["F","Este candidato promete <strong>assessorar a mulher a obter a escritura da casa própria no seu nome</strong>, como forma de autonomia e proteção contra a violência doméstica, e ampliar os espaços de acolhimento. Quem é?","Plano de Flávio Bolsonaro, “Casa Segura”, p. 20."],
["F","Quem propõe a <strong>“Escola Brasil por Elas”</strong>, apresentada como o maior programa gratuito de capacitação feminina da América Latina, com cursos de inteligência artificial, programação e marketing digital ligados ao Sistema S e a vagas de emprego?","Plano de Flávio Bolsonaro, “Escola Brasil por Elas”, p. 20."],
["F","Quem propõe um <strong>voucher-creche</strong>: onde não houver vaga na creche pública, a família recebe um vale para matricular a criança na rede privada credenciada até a vaga pública surgir?","Plano de Flávio Bolsonaro, “Creche garantida para toda criança”, p. 21."],
["F","Quem propõe <strong>Unidades Móveis de Saúde da Mulher</strong> em ônibus, caminhões e barcos adaptados, com exames preventivos e atenção à menopausa, à gestação e à endometriose?","Plano de Flávio Bolsonaro, “Saúde para Elas”, p. 21."],
["F","Quem quer tratar a <strong>internet como infraestrutura</strong>, como uma estrada, garantindo pacotes de conexão e levando cobertura a escolas, áreas rurais e regiões de fronteira, dando continuidade ao programa Wi-Fi Brasil?","Plano de Flávio Bolsonaro, “Internet como infraestrutura”, p. 24."],
["F","Este candidato promete <strong>digitalizar 100% dos serviços federais</strong> passíveis de digitalização, sob o princípio “digital by design”, e <strong>proibir que o governo peça de novo documentos que já possui</strong>. Quem é?","Plano de Flávio Bolsonaro, “Estado Digital”, p. 24-25."],
["F","Quem propõe uma <strong>identidade digital única integrada ao Gov.br</strong>, com assistentes automatizados que montam a trilha de serviços de cada cidadão, inclusive por comando de voz?","Plano de Flávio Bolsonaro, “Estado Digital”, p. 25."],
["F","Quem propõe um <strong>aplicativo de companhia com alertas de perigo</strong> para idosos que vivem sozinhos, dando tranquilidade ao filho que mora longe?","Plano de Flávio Bolsonaro, p. 25 e 39."],
["F","Para acabar com a fila do INSS, quem propõe digitalizar os processos e trocar a <strong>“gestão voltada a entidades sindicais” por uma gestão profissional</strong> medida pelo tempo que o aposentado espera para receber?","Plano de Flávio Bolsonaro, “INSS sem fila”, p. 26."],
["F","Quem quer levar a <strong>Lei de Liberdade Econômica a todos os estados e municípios</strong> e promover um amplo “revogaço” regulatório de normas obsoletas para quem empreende?","Plano de Flávio Bolsonaro, “Desburocratização para quem empreende”, p. 27."],
["F","Quem propõe <strong>simplificar as outorgas de irrigação</strong>, que hoje levam em média 24 meses, e acelerar a titulação do pequeno proprietário rural?","Plano de Flávio Bolsonaro, “Menos burocracia no campo”, p. 27-28."],

const NOME = {L:"Lula", F:"Flávio Bolsonaro"};
const POR_RODADA = 10, TOTAL = 20;
const app = document.getElementById("app");
let rodada = [], idx = 0, respostas = [], escolha = null, filtro = "todas", nome = "";
const esc = t => t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function embaralhar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const topo = () => window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});

function abertura(){
  const nL = PERGUNTAS.filter(p=>p[0]==="L").length, nF = PERGUNTAS.filter(p=>p[0]==="F").length;
  app.innerHTML = `
  <section class="abertura entra">
    <h1>Você sabe quem propõe o quê?</h1>
    <p>São ${nL+nF} propostas tiradas dos planos de governo de Lula e de Flávio Bolsonaro. Cada pergunta explica a proposta e como ela seria executada. Você aponta o autor.</p>
    <div class="regras">
      <div><b>20 perguntas</b><span>10 de cada plano, sorteadas e embaralhadas a cada rodada.</span></div>
      <div><b>Sem spoiler</b><span>Você só descobre se acertou no final, com a explicação de cada resposta.</span></div>
      <div><b>Temas comuns</b><span>Quando os dois planos falam do mesmo tema, a pista está na forma de execução.</span></div>
    </div>
    <div class="nome">
      <label for="campo-nome">Qual é o seu nome?</label>
      <input id="campo-nome" type="text" maxlength="40" autocomplete="given-name" placeholder="Digite seu nome" value="${esc(nome)}">
      <p class="aviso" id="aviso" role="alert"></p>
      <button class="botao" id="comecar">Começar o jogo</button>
    </div>
    <p style="margin-top:16px;font-size:.9rem">No teclado: L ou A para Lula, F ou B para Flávio Bolsonaro, Enter para confirmar.</p>
  </section>`;
  const campo = document.getElementById("campo-nome");
  const iniciar = () => {
    const v = campo.value.trim();
    if(!v){ document.getElementById("aviso").textContent = "Digite seu nome para começar."; campo.focus(); return; }
    nome = v; novaRodada();
  };
  document.getElementById("comecar").onclick = iniciar;
  campo.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); iniciar(); } });
  campo.addEventListener("input", () => { document.getElementById("aviso").textContent = ""; });
}

function novaRodada(){
  const L = embaralhar(PERGUNTAS.filter(p=>p[0]==="L")).slice(0,POR_RODADA);
  const F = embaralhar(PERGUNTAS.filter(p=>p[0]==="F")).slice(0,POR_RODADA);
  rodada = embaralhar(L.concat(F)); idx=0; respostas=[]; filtro="todas";
  pergunta(); topo();
}

function escada(){
  let h = "";
  for(let i=0;i<TOTAL;i++){
    const cls = i<idx ? "feita" : i===idx ? "atual" : "";
    h += `<li class="${cls} ${(i+1)%5===0?"marco":""}"><span class="n">${i+1}</span></li>`;
  }
  return `<ol class="escada" aria-label="Progresso">${h}</ol>`;
}

function pergunta(){
  escolha = null;
  const p = rodada[idx];
  app.innerHTML = `
  <div class="palco">
    <div class="centro entra">
      <div class="moldura"><div class="placa">
        <div class="placa-topo"><span>Pergunta <b>${idx+1}</b> de ${TOTAL}</span><span>Quem propõe?</span></div>
        ${p[3]?'<span class="tag">Tema presente nos dois planos: repare na forma de execução</span>':''}
        <p class="pergunta">${p[1]}</p>
      </div></div>
      <div class="opcoes" role="group" aria-label="Alternativas">
        <button class="opcao" data-c="L" aria-pressed="false"><span class="miolo"><span class="letra">A</span>Lula</span></button>
        <button class="opcao" data-c="F" aria-pressed="false"><span class="miolo"><span class="letra">B</span>Flávio Bolsonaro</span></button>
      </div>
      <div class="confirma">
        <p id="host">Escolha uma alternativa.</p>
        <button class="botao" id="confirmar" disabled>${idx===TOTAL-1?"Confirmar e ver resultado":"Confirmar resposta"}</button>
      </div>
    </div>
    ${escada()}
  </div>`;
  app.querySelectorAll(".opcao").forEach(b=>b.onclick=()=>marcar(b.dataset.c));
  document.getElementById("confirmar").onclick = confirmar;
  const at=app.querySelector(".escada li.atual"); const esc=app.querySelector(".escada"); if(at&&esc&&esc.scrollWidth>esc.clientWidth) esc.scrollLeft = at.offsetLeft - esc.clientWidth/2;
}

function marcar(c){
  if(!rodada.length || idx>=TOTAL) return;
  escolha = c;
  app.querySelectorAll(".opcao").forEach(b=>{const on=b.dataset.c===c; b.classList.toggle("sel",on); b.setAttribute("aria-pressed",on);});
  const host = document.getElementById("host");
  host.textContent = `${NOME[c]}. Está certo disso?`; host.className = "pergunta-host";
  const bt = document.getElementById("confirmar"); bt.disabled = false; bt.focus({preventScroll:true});
}

function confirmar(){
  if(!escolha) return;
  const p = rodada[idx];
  respostas.push({p, escolha, ok: escolha===p[0]});
  idx++;
  if(idx<TOTAL){ pergunta(); } else { resultado(); topo(); }
}

function porque(p){
  const fonte = p[2].charAt(0).toLowerCase()+p[2].slice(1);
  return `<b>Por quê:</b> a proposta está no ${fonte}`;
}

function resultado(){
  const ac = respostas.filter(r=>r.ok).length;
  const aL = respostas.filter(r=>r.ok&&r.p[0]==="L").length, aF = respostas.filter(r=>r.ok&&r.p[0]==="F").length;
  const frase = ac===20 ? "Gabaritou! Você conhece os dois planos de ponta a ponta." :
                ac>=16 ? "Excelente: você domina os dois planos." :
                ac>=12 ? "Bom resultado, com algumas confusões entre os planos." :
                ac>=8  ? "Metade do caminho: confira abaixo onde os planos se diferenciam." :
                         "Os planos ainda guardam surpresas para você. Veja as explicações abaixo.";
  app.innerHTML = `
  <section class="resultado entra">
    <div class="placar">
      <p class="quem">${esc(nome)},</p>
      <p class="rot">você acertou</p>
      <p class="num">${ac}<span style="font-size:.45em;color:var(--muted);text-shadow:none"> de ${TOTAL}</span></p>
      <p class="frase">${frase}</p>
      <div class="parciais">
        <span>Propostas de Lula: <b>${aL} de 10</b></span>
        <span>Propostas de Flávio Bolsonaro: <b>${aF} de 10</b></span>
      </div>
    </div>
    <div class="filtro" role="group" aria-label="Filtrar respostas">
      <button data-f="todas">Todas (${TOTAL})</button>
      <button data-f="certas">Acertos (${ac})</button>
      <button data-f="erradas">Erros (${TOTAL-ac})</button>
    </div>
    <div class="lista" id="lista"></div>
    <div class="acoes"><button class="botao" id="denovo">Jogar nova rodada</button><button class="botao sec" id="inicio">Voltar ao início</button></div>
  </section>`;
  app.querySelectorAll(".filtro button").forEach(b=>b.onclick=()=>{filtro=b.dataset.f; lista();});
  document.getElementById("denovo").onclick = novaRodada;
  document.getElementById("inicio").onclick = ()=>{rodada=[];abertura();topo();};
  lista();
}

function lista(){
  app.querySelectorAll(".filtro button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.f===filtro));
  const el = document.getElementById("lista");
  const itens = respostas.map((r,i)=>({r,i})).filter(({r})=> filtro==="todas" || (filtro==="certas"?r.ok:!r.ok));
  el.innerHTML = itens.length ? itens.map(({r,i})=>`
    <article class="card ${r.ok?"":"erro"}">
      <div class="cab"><span class="n">Pergunta ${i+1}</span><span class="st ${r.ok?"ok":"bad"}">${r.ok?"✓ Acertou":"✗ Errou"}</span></div>
      <p class="q">${r.p[1]}</p>
      <p class="resp"><span>Sua resposta: <b>${NOME[r.escolha]}</b></span><span>Resposta correta: <b>${NOME[r.p[0]]}</b></span></p>
      <p class="porque">${porque(r.p)}</p>
    </article>`).join("") : `<p style="text-align:center;color:var(--muted)">Nenhuma pergunta nesta categoria.</p>`;
}

document.addEventListener("keydown",e=>{
  if(!rodada.length || idx>=TOTAL) return;
  const k = e.key.toLowerCase();
  if(k==="l"||k==="a") marcar("L");
  else if(k==="f"||k==="b") marcar("F");
  else if(k==="enter" && escolha && !(document.activeElement && document.activeElement.tagName==="BUTTON")){ e.preventDefault(); confirmar(); }
});

abertura();
</script>
</body>
</html>
